<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Sports Rehab IQ — Evidence-based sports injury self-diagnosis and treatment tracking PWA" />
    <meta name="theme-color" content="#00d4aa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sports Rehab IQ — Sports Injury Guide</title>
    <script>
      // Force unregister all service workers to clear stuck PWA cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          let hasUnregistered = false;
          for(let registration of registrations) {
            registration.unregister();
            hasUnregistered = true;
          }
          if (hasUnregistered && !window.location.search.includes('cleared=1')) {
            window.location.search = '?cleared=1';
          }
        });
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
